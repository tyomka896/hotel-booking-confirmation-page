name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Set pnpm store directory
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ github.ref_name }}-
            ${{ runner.os }}-pnpm-

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"

          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          else
            case "$BASE_PATH" in
              /*) ;;
              *) BASE_PATH="/$BASE_PATH" ;;
            esac

            case "$BASE_PATH" in
              */) ;;
              *) BASE_PATH="$BASE_PATH/" ;;
            esac
          fi

          pnpm exec vite build --base="$BASE_PATH"

      - name: SPA fallback
        run: cp dist/index.html dist/404.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
